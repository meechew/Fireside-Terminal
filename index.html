<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: portrait puts buttons against the bottom edge, so the
       layout goes under the notch and home indicator and main.js reads
       env(safe-area-inset-*) back out to clear them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Fireside Terminal</title>
  <meta name="description" content="A cozy ASCII fireplace — retro terminal fire animation with CRT post-processing and NES-style renditions of public-domain Christmas carols.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://firesideterminal.online/">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fireside Terminal">
  <meta property="og:title" content="Fireside Terminal">
  <meta property="og:description" content="A cozy ASCII fireplace — retro terminal fire animation with CRT post-processing and NES-style renditions of public-domain Christmas carols.">
  <meta property="og:url" content="https://firesideterminal.online/">
  <meta property="og:image" content="https://firesideterminal.online/splash.png">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Fire is rendered full-screen; the bordered ASCII box is centered within. -->
  <canvas id="fire"></canvas>
  <!-- CRT post-processing overlay; sits above the fire, hidden by default. -->
  <canvas id="crt" hidden></canvas>

  <!-- Control panels float above the fire, mirroring the native side panels. -->
  <div id="left" class="panel"></div>
  <div id="right" class="panel"></div>

  <!-- Topmost CRT grid: scanlines + pixel separation + vignette, applied over
       the fire AND the panels (matches the native full-screen overlay). -->
  <canvas id="grid" hidden></canvas>

  <!-- Boot splash (BIOS POST) — sits above everything; js/boot.js animates it
       and removes it when the POST finishes or on the first key press / click.

       splash.png is the BACKDROP only (version + copyright line, wordmark,
       rule, embers): it is markup, so it paints before any JS runs, which is
       what keeps the first frame from being black while the module graph and
       the DOS font load. The POST lines and the closing line are drawn live
       into the two divs, on a 1920x1080 stage scaled to fit so they land on
       the same pixel grid the art was baked on. -->
  <div id="splash">
    <div id="splash-stage">
      <img id="splash-art" src="splash.png" alt="">
      <div id="splash-post"></div>
      <div id="splash-final"></div>
      <div id="splash-prompt"></div>
    </div>
  </div>

  <noscript><p style="color:#e0a458;font-family:monospace;padding:2rem;">Fireside Terminal needs JavaScript to burn.</p></noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
